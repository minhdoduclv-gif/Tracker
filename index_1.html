<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Session Ledger</title>
<style>
  :root {
    --paper: #f5f5f4;
    --card: #ffffff;
    --ink: #0f172a;
    --ink-soft: #64748b;
    --ink-faint: #94a3b8;
    --line: #e2e8f0;
    --tally: #b91c1c;
    --confirm: #047857;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 96px; }

  .masthead {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--ink); padding-bottom: 8px;
  }
  .masthead h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .link-btn {
    background: none; border: none; cursor: pointer;
    font-family: ui-monospace, monospace; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-soft);
  }
  .link-btn:hover { color: var(--ink); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .mt4 { margin-top: 16px; } .mt5 { margin-top: 20px; } .mt6 { margin-top: 24px; }

  input, select {
    font: inherit; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; outline: none; background: #fff; color: var(--ink);
  }
  input:focus, select:focus { border-color: var(--ink); }
  .eyebrow {
    font-family: ui-monospace, monospace; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-faint); margin-bottom: 8px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500;
    border: 1px solid var(--line); background: #fff; color: var(--ink-soft); cursor: pointer;
  }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 120px; }

  .btn-primary {
    width: 100%; margin-top: 12px; padding: 14px; border: none; border-radius: 10px;
    background: var(--tally); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:active { transform: scale(0.99); }
  .btn-dark {
    padding: 6px 16px; border: none; border-radius: 6px; background: var(--ink);
    color: #fff; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .flash { text-align: center; margin-top: 8px; font-size: 14px; font-weight: 500; color: var(--confirm); }

  .monthnav { display: flex; align-items: center; justify-content: space-between; }
  .arrow {
    width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; color: var(--ink-soft); font-size: 18px; cursor: pointer;
  }
  .month-title { text-align: center; font-weight: 600; }
  .month-sub { font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink-faint); }

  .student-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .student-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count-big { font-family: ui-monospace, monospace; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fee { font-family: ui-monospace, monospace; font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .tally { color: var(--tally); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 28px; }
  .tally .empty { color: #cbd5e1; font-size: 14px; font-style: italic; }

  .sess-list { margin-top: 12px; padding-top: 12px; border-top: 1px solid #f1f5f9; }
  .sess { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 3px 0; }
  .sess .date { font-family: ui-monospace, monospace; color: var(--ink-faint); width: 96px; flex-shrink: 0; }
  .sess .note { flex: 1; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .amt { font-family: ui-monospace, monospace; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .x { background: none; border: none; color: #cbd5e1; font-size: 18px; cursor: pointer; line-height: 1; padding: 0 4px; }
  .x:hover { color: var(--tally); }

  .total {
    margin-top: 24px; background: var(--ink); color: #fff; border-radius: 10px;
    padding: 16px; display: flex; align-items: center; justify-content: space-between;
  }
  .total .lbl { font-family: ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; }
  .total .amt { text-align: right; font-family: ui-monospace, monospace; font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }

  .empty-state { margin-top: 40px; text-align: center; color: var(--ink-soft); }
  .empty-state button { margin-top: 12px; padding: 10px 20px; border: none; border-radius: 10px; background: var(--ink); color: #fff; font-weight: 500; font-size: 16px; cursor: pointer; }

  .foot { margin-top: 32px; text-align: center; font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink-faint); }
  .sm-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sm-row .nm { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sm-row input { width: 112px; text-align: right; font-family: ui-monospace, monospace; font-size: 14px; }
  .sm-row .cur { font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink-faint); width: 36px; }
  .add-row { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; border-top: 1px solid #f1f5f9; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";

// ---------- storage ----------
var KEY = "tutor-session-data";
function load() {
  try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return { students: [], sessions: [] };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }
var DB = load();

// ---------- helpers ----------
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayISO() {
  var d = new Date(); d = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return d.toISOString().slice(0, 10);
}
function mKey(iso) { return iso.slice(0, 7); }
function shiftMonth(key, delta) {
  var p = key.split("-").map(Number); var d = new Date(p[0], p[1] - 1 + delta, 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
function monthLabel(key) {
  var p = key.split("-").map(Number);
  return new Date(p[0], p[1] - 1, 1).toLocaleString("en-US", { month: "long", year: "numeric" });
}
function prettyDate(iso) {
  var p = iso.split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2]).toLocaleString("en-US", { weekday: "short", day: "numeric", month: "short" });
}
function money(n, cur) {
  var s = Math.round(n).toLocaleString("en-US");
  if (cur === "VND") return s + "\u00A0\u20AB";
  if (cur === "USD") return "$" + s;
  return s + " " + cur;
}
function esc(str) { return String(str).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

// tally SVG: groups of five (4 bars + strike), remainder bars
function tallySVG(count) {
  if (count === 0) return '<span class="empty">no sessions</span>';
  var groups = Math.floor(count / 5), rem = count % 5, out = "";
  function grp(bars, strike) {
    var s = '<svg width="34" height="28" viewBox="0 0 34 28">';
    for (var i = 0; i < bars; i++) {
      var x = 4 + i * 6;
      s += '<line x1="' + x + '" y1="3" x2="' + x + '" y2="25" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>';
    }
    if (strike) s += '<line x1="1" y1="24" x2="27" y2="4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>';
    return s + "</svg>";
  }
  for (var g = 0; g < groups; g++) out += grp(4, true);
  if (rem > 0) out += grp(rem, false);
  return out;
}

// ---------- UI state ----------
var UI = {
  month: mKey(todayISO()),
  active: DB.students[0] ? DB.students[0].id : null,
  logDate: todayISO(),
  note: "",
  showStudents: false,
  flash: null,
  newCur: "VND"
};

// ---------- actions ----------
function addStudent(name, rate, cur) {
  name = (name || "").trim();
  rate = parseFloat(String(rate).replace(/[, ]/g, ""));
  if (!name || !rate || rate <= 0) { alert("Enter a name and a rate greater than 0."); return; }
  var s = { id: uid(), name: name, rate: rate, cur: cur };
  DB.students.push(s); if (!UI.active) UI.active = s.id; save(); render();
}
function updateRate(id, val) {
  var v = parseFloat(String(val).replace(/[, ]/g, ""));
  if (!v || v <= 0) return;
  DB.students.forEach(function (s) { if (s.id === id) s.rate = v; });
  save();
}
function removeStudent(id) {
  if (!confirm("Remove this student? Their logged sessions stay in the records.")) return;
  DB.students = DB.students.filter(function (s) { return s.id !== id; });
  if (UI.active === id) UI.active = DB.students[0] ? DB.students[0].id : null;
  save(); render();
}
function logSession() {
  var stu = DB.students.filter(function (s) { return s.id === UI.active; })[0];
  if (!stu) { alert("Pick a student first."); return; }
  DB.sessions.push({ id: uid(), studentId: stu.id, date: UI.logDate, note: (UI.note || "").trim(), rate: stu.rate, cur: stu.cur });
  UI.note = ""; UI.month = mKey(UI.logDate); UI.flash = stu.name;
  save(); render();
  setTimeout(function () { UI.flash = null; render(); }, 1500);
}
function removeSession(id) {
  DB.sessions = DB.sessions.filter(function (s) { return s.id !== id; });
  save(); render();
}

// ---------- render ----------
function render() {
  var app = document.getElementById("app");
  var monthSessions = DB.sessions.filter(function (s) { return mKey(s.date) === UI.month; });

  var html = "";
  html += '<div class="masthead"><h1>Session Ledger</h1>' +
    '<button class="link-btn" id="toggleStudents">' + (UI.showStudents ? "close" : "students") + '</button></div>';

  // students manager
  if (UI.showStudents) {
    html += '<div class="card mt4">';
    DB.students.forEach(function (s) {
      html += '<div class="sm-row">' +
        '<span class="nm">' + esc(s.name) + '</span>' +
        '<input type="text" inputmode="numeric" value="' + s.rate + '" data-rate="' + s.id + '">' +
        '<span class="cur">' + s.cur + '</span>' +
        '<button class="x" data-del-student="' + s.id + '">&times;</button>' +
        '</div>';
    });
    html += '<div class="add-row">' +
      '<input class="grow" id="newName" placeholder="Name" style="min-width:112px">' +
      '<input id="newRate" placeholder="Rate / session" inputmode="numeric" style="width:128px;font-family:ui-monospace,monospace">' +
      '<select id="newCur"><option' + (UI.newCur === "VND" ? " selected" : "") + '>VND</option><option' + (UI.newCur === "USD" ? " selected" : "") + '>USD</option></select>' +
      '<button class="btn-dark" id="addStudent">Add</button>' +
      '</div></div>';
  }

  if (DB.students.length === 0) {
    html += '<div class="empty-state"><p>No students yet.</p>' +
      '<button id="firstStudent">Add your first student</button></div>';
    app.innerHTML = html;
    wire();
    return;
  }

  // log panel
  html += '<div class="card mt5"><div class="eyebrow">Log a finished session</div><div class="chips">';
  DB.students.forEach(function (s) {
    html += '<button class="chip' + (UI.active === s.id ? " active" : "") + '" data-chip="' + s.id + '">' + esc(s.name) + '</button>';
  });
  html += '</div><div class="row">' +
    '<input type="date" id="logDate" value="' + UI.logDate + '" style="font-family:ui-monospace,monospace">' +
    '<input class="grow" id="note" placeholder="note (optional)" value="' + esc(UI.note) + '">' +
    '</div>' +
    '<button class="btn-primary" id="logBtn">&#10003; Mark session done</button>';
  if (UI.flash) html += '<div class="flash">Logged for ' + esc(UI.flash) + ' &#10003;</div>';
  html += '</div>';

  // month nav
  html += '<div class="monthnav mt6">' +
    '<button class="arrow" id="prevMonth">&lsaquo;</button>' +
    '<div class="month-title">' + monthLabel(UI.month) +
    '<div class="month-sub">' + monthSessions.length + ' session' + (monthSessions.length === 1 ? "" : "s") + '</div></div>' +
    '<button class="arrow" id="nextMonth">&rsaquo;</button></div>';

  // per-student summary
  DB.students.forEach(function (stu) {
    var list = monthSessions.filter(function (s) { return s.studentId === stu.id; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var fee = list.reduce(function (sum, s) { return sum + s.rate; }, 0);
    html += '<div class="card mt4"><div class="student-head">' +
      '<div style="min-width:0"><div class="student-name">' + esc(stu.name) + '</div>' +
      '<div class="tally">' + tallySVG(list.length) + '</div></div>' +
      '<div style="text-align:right;flex-shrink:0"><div class="count-big">' + list.length + '</div>' +
      '<div class="fee">' + money(fee, stu.cur) + '</div></div></div>';
    if (list.length) {
      html += '<div class="sess-list">';
      list.forEach(function (s) {
        html += '<div class="sess"><span class="date">' + prettyDate(s.date) + '</span>' +
          '<span class="note">' + (s.note ? esc(s.note) : "&mdash;") + '</span>' +
          '<span class="amt">' + money(s.rate, s.cur) + '</span>' +
          '<button class="x" data-del-sess="' + s.id + '">&times;</button></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  // grand total
  if (monthSessions.length) {
    var totals = {};
    monthSessions.forEach(function (s) { totals[s.cur] = (totals[s.cur] || 0) + s.rate; });
    var amts = Object.keys(totals).map(function (c) { return '<div>' + money(totals[c], c) + '</div>'; }).join("");
    html += '<div class="total"><div class="lbl">' + monthLabel(UI.month) + '<br>total due</div>' +
      '<div class="amt">' + amts + '</div></div>';
  }

  html += '<div class="foot">saved on this device &middot; rate is snapshotted per session</div>';

  app.innerHTML = html;
  wire();
}

// ---------- event wiring ----------
function wire() {
  var $ = function (id) { return document.getElementById(id); };
  function on(id, ev, fn) { var el = $(id); if (el) el.addEventListener(ev, fn); }

  on("toggleStudents", "click", function () { UI.showStudents = !UI.showStudents; render(); });
  on("firstStudent", "click", function () { UI.showStudents = true; render(); });

  on("addStudent", "click", function () {
    UI.newCur = $("newCur").value;
    addStudent($("newName").value, $("newRate").value, UI.newCur);
  });

  document.querySelectorAll("[data-rate]").forEach(function (el) {
    el.addEventListener("blur", function () { updateRate(el.getAttribute("data-rate"), el.value); });
  });
  document.querySelectorAll("[data-del-student]").forEach(function (el) {
    el.addEventListener("click", function () { removeStudent(el.getAttribute("data-del-student")); });
  });
  document.querySelectorAll("[data-chip]").forEach(function (el) {
    el.addEventListener("click", function () { UI.active = el.getAttribute("data-chip"); render(); });
  });
  document.querySelectorAll("[data-del-sess]").forEach(function (el) {
    el.addEventListener("click", function () { removeSession(el.getAttribute("data-del-sess")); });
  });

  on("logDate", "change", function (e) { UI.logDate = e.target.value; });
  on("note", "input", function (e) { UI.note = e.target.value; });
  on("logBtn", "click", logSession);
  on("prevMonth", "click", function () { UI.month = shiftMonth(UI.month, -1); render(); });
  on("nextMonth", "click", function () { UI.month = shiftMonth(UI.month, 1); render(); });
}

render();
</script>
</body>
</html>
